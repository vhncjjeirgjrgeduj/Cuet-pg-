const topicOf=q=>{if(q.t)return q.t;const rules=TR[q.u];if(!rules)return 'All';const txt=q.q+' '+q.o.join(' ');for(const [n,r] of rules){if(r.test(txt))return n}return rules[rules.length-1][0]==='Constitutionalism'?'Constitutionalism':'Other Topics'};

function startUnitTest(u,t){const pool=qs().filter(q=>q.u===u&&(!t||topicOf(q)===t));if(!pool.length)return alert('Is topic me abhi sawal nahi hain');const n=Math.min(pool.length,75);ST.exam={m:{n:u+(t?' - '+t:'')+' (CBT Practice)',pos:4,neg:1,m:Math.max(10,Math.round(n*1.2)),q:n,practice:true},i:-1,l:shuf(pool).slice(0,n).map(prep),a:{},rv:{},v:{},c:0,end:0,started:false};ST.tab='practice';render()}

function startExam(i){const m=mocks()[i];const pool=m.u==='All'?qs():qs().filter(q=>q.u===m.u);const r=rng(m.seed||i+1);const g={};pool.forEach(q=>(g[q.u]=g[q.u]||[]).push(q));const gs=Object.values(g).map(a=>shuf(a,r));let l=[];for(let k=0;l.length<m.q&&gs.some(a=>a.length>k);k++)gs.forEach(a=>{if(a[k]&&l.length<m.q)l.push(a[k])});l=shuf(l,r).map(prep);ST.exam={m,i,l,a:{},rv:{},v:{},c:0,end:0,started:false};render()}

V.result=()=>{const L=ST.last;if(!L){go('hist');return}const e=L.e;$('#v').innerHTML='<div class="card"><h2>'+(L.auto?'Time khatam - auto submit':'Test submit ho gaya')+'</h2><div class="timer">'+L.sc+' / '+L.mx+'</div><p class="muted">Sahi '+L.c+' &middot; Galat '+L.w+' &middot; Chhode '+L.sk+' &middot; Time '+L.used+' min</p></div>'+(e.m.sections?'<div class="card"><h3>Section-wise</h3>'+e.m.sections.map(n=>{let c=0,t=0;e.l.forEach((q,i)=>{if(q.sec===n){t++;if(e.a[i]===q.a)c++}});return'<p>'+esc(n)+': <b>'+c+' / '+t+'</b></p>'}).join('')+'</div>':'')+'<h2>Answer Review</h2>'+e.l.map((q,i)=>{const u=e.a[i],ok=u===q.a;return'<div class="card"><span class="tag">Q'+(i+1)+' &middot; '+esc(q.u)+'</span><p style="margin:6px 0">'+esc(q.q)+'</p>'+(q.y?'<p><span class="yr">PYQ: '+esc(q.y)+'</span></p>':'')+'<p>'+(u==null?'<span class="muted">Attempt nahi kiya</span>':'Aapka jawab: <b style="color:var(--'+(ok?'ok':'bad')+')">'+esc(q.o[u])+'</b>')+'</p><p>Sahi jawab: <b style="color:var(--ok)">'+esc(q.o[q.a])+'</b></p><p class="muted">'+esc(q.e||'')+'</p></div>'}).join('')};
V.hist=()=>{const r=results().filter(x=>x.u===ST.user.id).reverse();$('#v').innerHTML='<h2>Mere Results</h2>'+(r.length?r.map(x=>'<div class="card top"><div><h3>'+esc(x.n)+'</h3><span class="muted">'+esc(x.d)+'</span></div><div class="timer">'+x.sc+'/'+x.mx+'</div></div>').join(''):'<div class="card muted">Abhi koi test nahi diya. Mocks me jaake pehla test do.</div>')};
V.admin=()=>{const us=users();$('#v').innerHTML='<h2>Admin Control</h2><div class="card"><h3>Users</h3>'+us.map(u=>'<div class="top" style="margin:6px 0"><span>'+esc(u.id)+' <span class="tag">'+u.role+'</span></span><span class="row"><button onclick="copyInvite(\''+esc(u.id)+'\')">Invite link</button>'+(u.id===ST.user.id?'':'<button class="red" onclick="delUser(\''+esc(u.id)+'\')">Hatao</button>')+'</span></div>').join('')+'<hr style="border-color:#cfd6ff;margin:10px 0"><input id="nu" placeholder="Naya User ID"><input id="np" placeholder="Password"><select id="nr"><option value="user">User</option><option value="admin">Admin</option></select><button class="pri" onclick="addUser()">User jodo</button></div><div class="card"><h3>Mera password badlo</h3><input id="cp" type="password" placeholder="Naya password (min 8)"><button onclick="chPw()">Badlo</button></div><div class="card"><h3>Resource jodo (Drive link)</h3><select id="rg"><option>Study Material</option><option>PYQ</option><option>Syllabus</option></select><input id="ry" placeholder="Saal (sirf PYQ ke liye)"><input id="rn" placeholder="Naam"><input id="ru" placeholder="https://drive.google.com/..."><button class="pri" onclick="addRes()">Jodo</button></div><div class="card"><h3>PGAT real mock link jodo</h3><input id="mn" placeholder="Naam (jaise PGET Mock Test Practice 2)"><input id="ms" placeholder="Detail (jaise Paper 2 - Modern History)"><input id="mu" placeholder="https:// ya http:// link"><button class="pri" onclick="addPgm()">Jodo</button></div><div class="card"><h3>Questions import ('+qs().length+' abhi)</h3><p class="muted">Har line: Unit|Sawal|A|B|C|D|Sahi(A-D)|Explanation</p><textarea id="bq" rows="6"></textarea><div class="row"><button class="pri" onclick="bulk()">Import</button><button class="red" onclick="if(confirm(\'Saare questions hatao?\')){S(\'cpg_qs\',[]);V.admin()}">Sab hatao</button></div></div>'};
async function addUser(){const id=$('#nu').value.trim(),p=$('#np').value.trim();if(!id||p.length<6)return alert('ID aur 6+ akshar ka password do');if(users().some(u=>u.id.toLowerCase()===id.toLowerCase()))return alert('Ye ID pehle se hai');const l=users();l.push({id,h:await hash(id,p),role:$('#nr').value});S('cpg_users',l);V.admin();$('#v').insertAdjacentHTML('afterbegin','<div class="card"><h3>User jud gaya: '+esc(id)+'</h3><p>Ab neeche list me iske saamne <b>Invite link</b> dabao, link copy hoga. Wo link user ko WhatsApp par bhejo. User ko link apne phone me kholna hai, uske baad ID aur password se login hoga.</p></div>')}
function delUser(id){if(!confirm(id+' ko hatana hai?'))return;S('cpg_users',users().filter(u=>u.id!==id));V.admin()}
async function chPw(){const p=$('#cp').value.trim();if(p.length<8)return alert('Kam se kam 8 akshar');const l=users();const u=l.find(x=>x.id===ST.user.id);u.h=await hash(u.id,p);S('cpg_users',l);alert('Password badal gaya');V.admin()}
function addPgm(){const n=$('#mn').value.trim(),u=$('#mu').value.trim();if(!n||!/^https?:\/\//.test(u))return alert('Naam aur link do');const l=L('cpg_pgm',[]);l.push({n,sub:$('#ms').value.trim(),u});S('cpg_pgm',l);alert('Jud gaya. PGAT me dikhega.')}
function addRes(){const n=$('#rn').value.trim(),u=$('#ru').value.trim();if(!n||!/^https:\/\//.test(u))return alert('Naam aur https link do');const l=res();l.push({g:$('#rg').value,y:$('#ry').value.trim()||'Other',n,u});S('cpg_res',l);alert('Jud gaya')}
function bulk(){const rows=$('#bq').value.split('\n').map(x=>x.split('|').map(s=>s.trim())).filter(r=>r.length>=7&&'ABCD'.includes(r[6].toUpperCase()));const l=qs();const un=units();rows.forEach((r,i)=>{if(!un.includes(r[0]))un.push(r[0]);l.push({id:'i'+Date.now()+i,u:r[0],q:r[1],o:r.slice(2,6),a:'ABCD'.indexOf(r[6].toUpperCase()),e:r[7]||''})});S('cpg_units2',un);S('cpg_qs9',l);alert(rows.length+' sawal jude');V.admin()}

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('cpg_lib',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbAll=async()=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('items').objectStore('items').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbPut=async v=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('items','readwrite');t.objectStore('items').put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const idbDel=async id=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('items','readwrite');t.objectStore('items').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
let LIBI=[];
V.lib=async()=>{try{LIBI=(await idbAll()).sort((a,b)=>b.ts-a.ts)}catch(e){LIBI=[]}
$('#v').innerHTML='<h2>Add / Library</h2><div class="card"><h3>Kuch bhi jodo</h3><select id="lk" onchange="libKind()"><option value="file">File (PDF, image, doc...)</option><option value="link">Link</option><option value="note">Note</option></select><input id="lt" placeholder="Naam / title"><input id="lf" type="file" multiple><textarea id="lx" rows="4" placeholder="Link ya note likho" style="display:none"></textarea><button class="pri" onclick="libAdd()">Jodo</button><p class="muted">File is device ke browser me save hoti hai (max 25 MB). Dusre phone par dikhane ke liye Firebase chahiye.</p></div>'+(LIBI.length?LIBI.map(x=>'<div class="card item"><div><span class="tag">'+x.kind+'</span> <b>'+esc(x.title)+'</b><br><span class="muted">'+esc(x.owner)+' &middot; '+new Date(x.ts).toLocaleDateString()+(x.size?' &middot; '+Math.round(x.size/1024)+' KB':'')+'</span>'+(x.kind==='note'?'<p style="margin-top:6px;white-space:pre-wrap">'+esc(x.text)+'</p>':'')+'</div><div class="row">'+(x.kind==='file'?'<button onclick="libOpen(\''+x.id+'\')">Kholo</button>':x.kind==='link'?'<a class="btn" target="_blank" rel="noopener" href="'+esc(x.text)+'">Kholo</a>':'')+((x.owner===ST.user.id||ST.user.role==='admin')?'<button class="red" onclick="libDel(\''+x.id+'\')">Hatao</button>':'')+'</div></div>').join(''):'<div class="card muted">Abhi kuch nahi jodha. Upar se pehli file, link ya note jodo.</div>');libKind()};
function libKind(){const k=$('#lk').value;$('#lf').style.display=k==='file'?'block':'none';$('#lx').style.display=k==='file'?'none':'block'}
async function libAdd(){const k=$('#lk').value,t=$('#lt').value.trim();try{if(k==='file'){const fs=[...$('#lf').files];if(!fs.length)return alert('File chuno');for(const f of fs){if(f.size>25*1048576){alert(f.name+' 25 MB se badi hai');continue}await idbPut({id:'f'+Date.now()+Math.random().toString(36).slice(2,6),kind:'file',title:t||f.name,name:f.name,type:f.type,size:f.size,blob:f,owner:ST.user.id,ts:Date.now()})}}else{const x=$('#lx').value.trim();if(!x)return alert('Kuch likho');if(k==='link'&&!/^https?:\/\//.test(x))return alert('https:// wala link do');await idbPut({id:'n'+Date.now(),kind:k,title:t||(k==='link'?x:'Note'),text:x,owner:ST.user.id,ts:Date.now()})}V.lib()}catch(e){alert('Save nahi hua: '+e.message)}}
async function libOpen(id){const x=LIBI.find(i=>i.id===id);if(!x)return;const u=URL.createObjectURL(x.blob);const a=document.createElement('a');a.href=u;a.target='_blank';a.download=x.name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function libDel(id){if(confirm('Hatana hai?')){await idbDel(id);V.lib()}}
(function(){const c=document.createElement('canvas');c.id='bg';document.body.prepend(c);const x=c.getContext('2d');let W,H,P=[],on=false;const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,col=['#0a7cff','#7c3aed','#ec4899','#06b6d4'];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=[...Array(Math.min(80,Math.floor(W*H/16000)))].map(()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:1.4+Math.random()*2,c:col[Math.floor(Math.random()*4)]}))}
function f(t){x.clearRect(0,0,W,H);[[.2,.25,'#7c3aed'],[.8,.3,'#0a7cff'],[.5,.85,'#ec4899']].forEach((o,i)=>{const px=(o[0]+.06*Math.sin(t/4000+i))*W,py=(o[1]+.06*Math.cos(t/5000+i))*H,g=x.createRadialGradient(px,py,0,px,py,Math.max(W,H)*.35);g.addColorStop(0,o[2]+'30');g.addColorStop(1,o[2]+'00');x.fillStyle=g;x.fillRect(0,0,W,H)});
x.lineWidth=1;for(let i=0;i<P.length;i++){const p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.fillStyle=p.c+'aa';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<120){x.strokeStyle=p.c+Math.floor((1-d/120)*60).toString(16).padStart(2,'0');x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}}
if(!RM&&!document.hidden)requestAnimationFrame(f);else on=false}
addEventListener('resize',rs);rs();const go2=()=>{if(!on&&!RM){on=true;requestAnimationFrame(f)}};if(RM)f(0);else go2();document.addEventListener('visibilitychange',go2)})();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script></body></html>
